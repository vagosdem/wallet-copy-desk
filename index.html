<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wallet Copy Desk — paper monitor</title>
  <meta name="description" content="Paper-mode Solana USDC/JUP copy desk dashboard. Simulated fills plus clearly separated observed, watch-only GMGN wallet activity.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect rx='14' width='64' height='64' fill='%2316a34a'/><text x='32' y='44' text-anchor='middle' font-size='36' fill='white' font-family='sans-serif'>P</text></svg>">
  <script src="vendor/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg: #f6f7f8;
      --ink: #111111;
      --muted: #6b7280;
      --faint: #9ca3af;
      --line: #ececec;
      --card: #ffffff;
      --green: #16a34a;
      --green-bg: #dcfce7;
      --green-ink: #166534;
      --red: #dc2626;
      --red-bg: #fee2e2;
      --red-ink: #991b1b;
      --blue: #2563eb;
      --shadow: 0 1px 2px rgba(17,24,39,0.04), 0 8px 24px rgba(17,24,39,0.05);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--font); overflow-x: hidden; }
    body { min-height: 100vh; }
    #app { overflow-x: hidden; }
    a { color: var(--blue); text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 48px; width: 100%; min-width: 0; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    h1 { font-size: 18px; font-weight: 750; letter-spacing: -0.03em; margin: 0; }
    .sub { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
    .card { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: 16px 18px; min-width: 0; }
    button, .card, .modal { scroll-margin-top: 56px; }
    .title { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; margin: 0 0 12px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 650; letter-spacing: 0.01em; line-height: 1.2; white-space: nowrap; }
    .dot { width: 7px; height: 7px; border-radius: 999px; display: inline-block; flex-shrink: 0; }
    .dot.blink { animation: blink 1.2s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.18; } }
    .grid { display: grid; gap: 12px; }
    .cols-2 { grid-template-columns: 1fr; }
    @media (min-width: 860px) { .cols-2 { grid-template-columns: 1.2fr 0.8fr; } }
    .kpi-label { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    .kpi-num { font-variant-numeric: tabular-nums; font-weight: 800; letter-spacing: -0.04em; line-height: 1.05; }
    .mono, .tabular, .log, .equity-num, .mult { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    button, select, input[type="date"], input[type="text"] {
      font: inherit; color: var(--ink); background: #f9fafb; border: 1px solid var(--line);
      border-radius: 999px; padding: 5px 10px; cursor: pointer;
    }
    button.active, .wallet-card.active { outline: 2px solid var(--blue); background: #eff6ff; }
    button:hover, .wallet-card:hover { border-color: #d1d5db; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    .wallet-card { cursor: pointer; border: 1px solid transparent; border-radius: 12px; padding: 12px; text-align: left; background: #f9fafb; width: 100%; }
    .wallet-card[disabled] { cursor: default; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-size: 11px; letter-spacing: 0.04em; cursor: pointer; user-select: none; white-space: nowrap; }
    th.sorted { color: var(--ink); }
    .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; padding: 2px 7px; border-radius: 6px; }
    .tag.BUY { background: #dcfce7; color: #166534; }
    .tag.SELL { background: #fee2e2; color: #991b1b; }
    .tag.SKIP, .tag.UNRESOLVED, .tag.KEEP { background: #f3f4f6; color: #6b7280; }
    .tag.ADD { background: #dcfce7; color: #166534; }
    .tag.DROP { background: #fee2e2; color: #991b1b; }
    .feed { display: flex; flex-direction: column; max-height: 420px; overflow: auto; }
    .feed-item { padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; line-height: 1.45; }
    .feed-item:first-child { border-top: 0; }
    .bar { height: 8px; border-radius: 999px; background: #f3f4f6; overflow: hidden; }
    .bar > div { height: 100%; border-radius: 999px; background: var(--blue); }
    .timeline { display: flex; flex-direction: column; gap: 10px; }
    .tl { position: relative; padding-left: 16px; border-left: 2px solid var(--line); margin-left: 4px; }
    .tl::before { content: ""; position: absolute; left: -5px; top: 6px; width: 8px; height: 8px; border-radius: 99px; background: var(--green); }
    .tl.alert::before, .tl.drop::before { background: var(--red); }
    .tl.add::before { background: var(--green); }
    .muted { color: var(--muted); } .faint { color: var(--faint); }
    .up { color: var(--green); } .down { color: var(--red); }
    .footer { font-size: 11px; color: var(--faint); margin-top: 16px; line-height: 1.5; }
    .error { background: var(--red-bg); color: var(--red-ink); padding: 14px 16px; border-radius: 12px; }
    .live-ok { color: var(--green-ink); }
    .chart-box { position: relative; height: 220px; margin-top: 8px; }
    .chart-box.price { height: 320px; }
    .chart-box.equity-live { height: 180px; }
    .banner { background: #fff7ed; color: #9a3412; border-radius: 10px; padding: 8px 12px; font-size: 12px; margin: 8px 0; line-height: 1.45; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 10px 0 14px; }
    .metric { background: #f9fafb; border-radius: 12px; padding: 10px 12px; }
    .metric .kpi-label { margin-bottom: 2px; }
    .metric .kpi-num { font-size: 18px; }
    .ticker { background: #fff; border-bottom: 1px solid var(--line); overflow: hidden; display: flex; align-items: center; gap: 10px; padding: 8px 0; position: sticky; top: 0; z-index: 20; width: 100%; max-width: 100vw; }
    .ticker-mask { flex: 1 1 auto; overflow: hidden; min-width: 0; mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 24px), transparent); }
    .ticker-track { display: flex; gap: 22px; width: max-content; animation: marquee 36s linear infinite; }
    .ticker-track:hover { animation-play-state: paused; }
    @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .tick { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }
    .tick .sym { font-weight: 700; }
    .tick .chg { font-family: var(--mono); font-weight: 650; }
    .top { padding: 14px 0 8px; }
    .seg { display: inline-flex; background: #eceef1; border-radius: 999px; padding: 3px; }
    .seg button { border: 0; background: transparent; padding: 5px 14px; font-size: 13px; font-weight: 650; color: var(--muted); border-radius: 999px; }
    .seg button.active { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.06); outline: none; }
    .status-line { font-size: 13px; color: var(--muted); margin: 8px 0 12px; }
    .equity-num { font-size: 52px; font-weight: 750; letter-spacing: -0.05em; line-height: 1; }
    @media (min-width: 700px) { .equity-num { font-size: 64px; } }
    .equity-unit { font-size: 16px; font-weight: 600; color: var(--muted); margin-left: 6px; }
    .mult { background: #111; color: #fff; border-radius: 999px; padding: 3px 10px; font-size: 14px; font-weight: 700; }
    .live-meta { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
    .live-grid { display: grid; gap: 12px; min-width: 0; }
    .grid, .live-grid > * { min-width: 0; }
    @media (min-width: 960px) { .live-grid { grid-template-columns: 1.05fr 0.95fr; align-items: start; } }
    .comp-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
    .comp-row:first-child { border-top: 0; padding-top: 0; }
    .comp-row .name { font-weight: 650; flex: 1 1 auto; }
    .comp-row .count { font-family: var(--mono); color: var(--green-ink); font-weight: 650; font-size: 13px; }
    @media (max-width: 640px) { .comp-row .count { flex: 1 1 100%; padding-left: 18px; } }
    .agent-row { display: grid; grid-template-columns: 132px 1fr auto; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; }
    .agent-row:first-of-type { border-top: 0; }
    @media (max-width: 640px) { .agent-row { grid-template-columns: 1fr; gap: 4px; } }
    .log { font-size: 12.5px; line-height: 1.7; max-height: 280px; overflow: auto; background: #fafafa; border-radius: 12px; padding: 10px 12px; }
    .log a { font-weight: 500; color: inherit; text-decoration: none; }
    .log a:hover { text-decoration: underline; }
    .log .pos { color: var(--green); }
    .log .neg { color: var(--red); }
    .log .dim { color: var(--muted); }
    .comp-card h3 { margin: 0; font-size: 15px; font-weight: 700; }
    .comp-file { font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 650; }
    .modal-back { position: fixed; inset: 0; background: rgba(17,24,39,0.35); z-index: 40; display: flex; align-items: flex-end; justify-content: center; padding: 12px; }
    @media (min-width: 700px) { .modal-back { align-items: center; } }
    .modal { background: #fff; border-radius: 24px 24px 16px 16px; width: min(440px, 100%); padding: 22px 22px 18px; box-shadow: 0 20px 50px rgba(0,0,0,0.18); max-height: 92vh; overflow: auto; }
    .modal > .row { flex-wrap: nowrap; }
    .modal .big { font-family: var(--mono); font-size: 42px; font-weight: 750; letter-spacing: -0.04em; line-height: 1; }
    .recap-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 16px 0; }
    .recap-stats div { background: #f4f5f6; border-radius: 12px; padding: 10px 8px; text-align: center; }
    .recap-stats .n { font-family: var(--mono); font-size: 18px; font-weight: 750; }
    .recap-stats .l { font-size: 11px; color: var(--muted); margin-top: 2px; }
    @media (max-width: 400px) { .recap-stats { grid-template-columns: repeat(2, 1fr); } .equity-num { font-size: 44px; } }
  </style>
</head>
<body>
  <div id="app">
    <div class="wrap"><div class="error">Loading dashboard data…</div></div>
  </div>
  <script>

    const FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
    const GREEN = "#16a34a";
    const JUP_MINT = "JUPyiwrYJFskUPiHa7hkeR8VUtAeFoSYbKedZNsDvCN";
    const PRICE_URLS = [
      "https://lite-api.jup.ag/price/v3?ids=" + JUP_MINT,
      "https://api.jup.ag/price/v3?ids=" + JUP_MINT,
    ];

    let DATA = null;
    let livePrice = null;
    let liveAt = null;
    let liveError = null;
    let priceChart = null;
    let equityChart = null;
    let chartObservers = [];
    let equityAnimated = false;
    const state = {
      view: "live",
      recap: false,
      gmgnWallet: "all",
      gmgnSide: "all",
      gmgnToken: "",
      wallet: "all",
      kind: "all",
      date: "",
      bot: "all",
      range: "ALL",
      sortKey: "observed_time_iso",
      sortDir: "desc",
      showArchived: false,
      archivedDefaulted: false,
    };

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }
    function signed(n, digits = 2) {
      if (n == null || Number.isNaN(n)) return "—";
      const sign = n > 0 ? "+" : n < 0 ? "−" : "";
      return sign + Math.abs(n).toFixed(digits);
    }
    function money(n) { return (n < 0 ? "−" : "") + Math.abs(n).toFixed(2); }
    function athensNowLabel(date = new Date()) {
      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/Athens", hour: "2-digit", minute: "2-digit", hour12: false
      }).formatToParts(date);
      const hh = parts.find((p) => p.type === "hour").value;
      const mm = parts.find((p) => p.type === "minute").value;
      return hh + ":" + mm + " Europe/Athens";
    }
    function asOf(hhmm) { return (hhmm || "") + " Europe/Athens"; }
    function eventHmm(ev) {
      const iso = ev.time_iso || "";
      const fromIso = iso.match(/T(\d{2}:\d{2})/);
      if (fromIso) return fromIso[1];
      const fromLabel = (ev.time || "").match(/\b(\d{2}:\d{2}):\d{2}\b/) || (ev.time || "").match(/\b(\d{2}:\d{2})\b/);
      return fromLabel ? fromLabel[1] : "—";
    }
    function pill(label, bg, color, dot, blink) {
      return `<span class="pill" style="background:${bg};color:${color}">${
        dot ? `<span class="dot${blink ? " blink" : ""}" style="background:${dot}"></span>` : ""
      }${esc(label)}</span>`;
    }
    function currentMark() {
      return livePrice != null ? livePrice : DATA.price.usd;
    }
    function markedFigures() {
      const k = DATA.kpis;
      const px = currentMark();
      const openMark = k.open_jup * px;
      const equity = k.cash_usdc + openMark;
      const change = equity - k.start_cash_usdc;
      const unrealized = openMark - k.open_cost_usdc;
      const multiple = equity / k.start_cash_usdc;
      return { px, openMark, equity, change, changePct: (change / k.start_cash_usdc) * 100, unrealized, multiple };
    }
    function changeClass(n) { return n > 0 ? "up" : n < 0 ? "down" : ""; }
    function applyFilters(decisions) {
      return decisions.filter((row) => {
        if (state.wallet !== "all" && row.wallet !== state.wallet) return false;
        if (state.kind === "fills" && row.tag === "SKIP") return false;
        if (state.kind === "skips" && row.tag !== "SKIP") return false;
        if (state.date) {
          const iso = row.observed_time_iso || row.chain_time_iso || "";
          if (!iso.startsWith(state.date)) return false;
        }
        return true;
      });
    }
    function sortRows(rows) {
      const key = state.sortKey;
      const dir = state.sortDir === "asc" ? 1 : -1;
      return [...rows].sort((a, b) => {
        const va = a[key], vb = b[key];
        if (va == null && vb == null) return 0;
        if (va == null) return 1;
        if (vb == null) return -1;
        if (typeof va === "number" && typeof vb === "number") return (va - vb) * dir;
        return String(va).localeCompare(String(vb)) * dir;
      });
    }
    function setWallet(wallet) {
      state.wallet = state.wallet === wallet ? "all" : wallet;
      render();
    }
    function pointUnix(p) {
      if (p && typeof p.time === "number" && p.time > 0) return p.time;
      const parsed = Date.parse(p && p.iso);
      if (!Number.isNaN(parsed)) return Math.floor(parsed / 1000);
      return null;
    }
    function applyRange(points) {
      const hours = { "1H": 1, "6H": 6, "1D": 24, ALL: null }[state.range];
      if (!hours) return points;
      const cut = Math.floor(Date.now() / 1000) - hours * 3600;
      const filtered = points.filter((p) => {
        const t = pointUnix(p);
        return t != null && t >= cut;
      });
      return filtered.length ? filtered : points.slice(-2);
    }
    function currentEquityPoints() {
      const series = (DATA.charts && DATA.charts.equity && DATA.charts.equity.length)
        ? DATA.charts.equity
        : (DATA.equity_series || []);
      const marked = markedFigures();
      const points = series.map((p) => ({ ...p }));
      if (points.length && livePrice != null) {
        const last = points[points.length - 1];
        if (last.kind === "mark") {
          last.equity = marked.equity;
          last.equity_display = money(marked.equity);
          last.time = Math.floor(Date.now() / 1000);
          last.iso = new Date().toISOString();
          last.t = athensNowLabel().slice(0, 5);
        } else {
          points.push({
            time: Math.floor(Date.now() / 1000),
            t: athensNowLabel().slice(0, 5),
            iso: new Date().toISOString(),
            equity: marked.equity,
            equity_display: money(marked.equity),
            kind: "mark",
          });
        }
      }
      return applyRange(points);
    }
    function destroyCharts() {
      chartObservers.forEach((ro) => ro.disconnect());
      chartObservers = [];
      if (priceChart) { priceChart.remove(); priceChart = null; }
      if (equityChart) { equityChart.remove(); equityChart = null; }
    }
    function lwOptions(el, height) {
      return {
        width: el.clientWidth,
        height: height || el.clientHeight || 220,
        layout: { background: { color: "#ffffff" }, textColor: "#6b7280", fontFamily: FONT },
        grid: { vertLines: { color: "#ececec" }, horzLines: { color: "#ececec" } },
        rightPriceScale: { borderColor: "#ececec" },
        timeScale: { borderColor: "#ececec", timeVisible: true, secondsVisible: false },
        crosshair: { horzLine: { color: "#d1d5db" }, vertLine: { color: "#d1d5db" } },
        handleScroll: true,
        handleScale: true,
      };
    }
    function watchSize(el, chart) {
      if (typeof ResizeObserver !== "function") return;
      const ro = new ResizeObserver(() => {
        if (!el.isConnected) return;
        chart.applyOptions({ width: el.clientWidth });
      });
      ro.observe(el);
      chartObservers.push(ro);
    }
    function uniqueTimes(rows) {
      const out = [];
      let last = null;
      rows.forEach((row) => {
        let t = row.time;
        if (typeof t !== "number") return;
        if (last != null && t <= last) t = last + 1;
        out.push({ ...row, time: t });
        last = t;
      });
      return out;
    }
    function drawPriceChart() {
      const el = document.getElementById("priceChart");
      if (!el || !window.LightweightCharts) return;
      const charts = DATA.charts || {};
      const candles = (charts.price && charts.price.candles) || [];
      if (!candles.length) {
        el.innerHTML = `<div class="muted" style="padding:16px">No price candles in this snapshot.</div>`;
        return;
      }
      priceChart = LightweightCharts.createChart(el, lwOptions(el, el.clientHeight || 320));
      const series = priceChart.addCandlestickSeries({
        upColor: GREEN, downColor: "#dc2626", borderVisible: false,
        wickUpColor: GREEN, wickDownColor: "#dc2626",
      });
      series.setData(candles.map((c) => ({ time: c.time, open: c.open, high: c.high, low: c.low, close: c.close })));
      const markers = [];
      (charts.markers || []).forEach((m) => {
        markers.push({ time: m.time, position: m.position, color: m.color, shape: m.shape, text: m.text });
      });
      if (state.showArchived) {
        ((charts.archived && charts.archived.markers) || []).forEach((m) => {
          markers.push({
            time: m.time, position: m.position,
            color: m.side === "buy" ? "#15803d" : "#b91c1c",
            shape: m.shape, text: "ARCHIVED " + (m.text || m.side || ""),
          });
        });
      }
      markers.sort((a, b) => a.time - b.time);
      if (markers.length) series.setMarkers(markers);
      priceChart.timeScale().fitContent();
      watchSize(el, priceChart);
    }
    function dottedStyle() {
      return (window.LightweightCharts && LightweightCharts.LineStyle)
        ? LightweightCharts.LineStyle.Dotted
        : 1;
    }
    function drawEquityChart() {
      const el = document.getElementById("equityChart");
      if (!el || !window.LightweightCharts) return;
      equityChart = LightweightCharts.createChart(el, lwOptions(el, el.clientHeight || 180));
      const current = uniqueTimes(currentEquityPoints().map((p) => ({
        time: pointUnix(p), value: p.equity
      })).filter((p) => p.time != null && p.value != null));
      const currentSeries = equityChart.addAreaSeries({
        lineColor: GREEN,
        topColor: "rgba(22,163,74,0.28)",
        bottomColor: "rgba(22,163,74,0.02)",
        lineWidth: 2,
        title: "Paper equity",
      });
      if (current.length) currentSeries.setData(current);
      currentSeries.createPriceLine({
        price: DATA.kpis.start_cash_usdc || 1000,
        color: "#9ca3af",
        lineWidth: 1,
        lineStyle: dottedStyle(),
        axisLabelVisible: true,
        title: "start 1,000",
      });
      if (state.showArchived) {
        const archived = uniqueTimes((((DATA.charts || {}).archived || {}).equity || []).map((p) => ({
          time: pointUnix(p), value: p.equity
        })).filter((p) => p.time != null && p.value != null));
        const archivedSeries = equityChart.addLineSeries({
          color: "#c2410c", lineWidth: 2, lineStyle: 2, title: "Archived run",
        });
        if (archived.length) archivedSeries.setData(archived);
      }
      equityChart.timeScale().fitContent();
      watchSize(el, equityChart);
    }

    function tickerHtml() {
      const items = (DATA.ticker && DATA.ticker.items) || [];
      const live = DATA.watcher && DATA.watcher.up;
      const chips = items.map((t) => {
        const ch = t.change_1h_pct;
        return `<span class="tick"><span class="sym">${esc(t.pair || t.symbol)}</span><span class="chg ${changeClass(ch)}">${esc(signed(ch))}%</span><span class="faint">1h</span></span>`;
      });
      const body = chips.length
        ? chips.join("")

        if (state.gmgnSide !== 'all' && (ev.status !== 'resolved' ? 'unresolved' : ev.side) !== state.gmgnSide) return false;

          if (!tokens.some((t) => (String(t.mint || '') + ' ' + String(t.symbol || '')).toLowerCase().includes(query))) return false;

        return true;

    function animateEquity() {
      const el = document.getElementById("equityNum");
      if (!el || equityAnimated) return;
      const target = Number(el.getAttribute("data-target"));
      if (!Number.isFinite(target)) return;
      equityAnimated = true;
      const unit = el.querySelector(".equity-unit")?.outerHTML || "";
      const start = performance.now();
      const dur = 700;
      function frame(now) {
        const t = Math.min(1, (now - start) / dur);
        const eased = 1 - Math.pow(1 - t, 3);
        el.innerHTML = esc(money(target * eased)) + unit;
        if (t < 1) requestAnimationFrame(frame);
        else el.innerHTML = esc(money(target)) + unit;
      }
      requestAnimationFrame(frame);
    }

          <td class="tabular">${esc(cbPrice(p.mark_price_usdc_per_token))} / ${esc(cbPrice(p.stop_price_usdc_per_token))}</td></tr>`).join('')}</tbody></table></div>`
        : `<div class="muted" style="font-size:13px">No open paper positions.</div>`;
      const skipList = (b) => (b.skips_by_reason || []).length ? (b.skips_by_reason || []).map(([r, n]) => `<div class="row" style="justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px solid var(--line)"><span>${esc(r)}</span><span class="tabular" style="font-weight:650">${esc(n)}</span></div>`).join('') : '<div class="muted" style="font-size:13px">None yet.</div>';
      const leaders = (g.per_leader || []).map((l) => `<div class="wallet-card" style="cursor:default;overflow-wrap:anywhere">
          <a href="${esc(l.solscan)}" target="_blank" rel="noreferrer" style="font-weight:650">${esc(l.leader)}</a>
          <div class="tabular" style="font-size:13px;line-height:1.6;margin-top:6px">${esc(l.signals)} swaps (${esc(l.buys)} buy / ${esc(l.sells)} sell)<br>paper fills: ${esc(l.filtered_fills)} filtered · ${esc(l.shadow_fills)} shadow</div>
          <div class="muted" style="font-size:12px;margin-top:4px">${esc(Number(l.txs_seen).toLocaleString())} txs seen · ${esc(Number(l.failed_filtered).toLocaleString())} failed (ignored)<br>${esc(l.not_signed_by_leader)} not signed by leader · ${esc(l.unsupported)} unsupported · ${esc(l.pending)} queued</div>
        </div>`).join('');
      const gaps = (g.gaps || []).map((x) => `<li>${esc(x.leader)}: ${esc(x.reason)} ×${esc(x.count)} (last ${esc((x.last || '').slice(11, 19))})</li>`).join('');
      const p = g.process || {};
      return `<section class="card" id="gmgn-copy-book" style="margin-top:12px">
        <div class="row" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
          <h2 class="title" style="margin:0">GMGN copy book <span class="pill" style="background:#fef3c7;color:#92400e">PAPER</span></h2>
          <div class="muted" style="font-size:12px">${p.running ? 'Book running' : 'Book NOT running'} at snapshot · snapshot ${esc(Math.floor(age / 60))} min old · ${esc((g.generated_at || '').slice(11, 19))} Europe/Athens</div>
        </div>
        <p style="font-size:13px;line-height:1.5;margin:8px 0 12px"><strong>Simulated paper trades only — nothing is bought or sold for real.</strong> Copies hubz, theo and motioncat: buy 10 USDC when they buy, sell the fraction they sell, flat −6% stop per buy. Priced with Jupiter quotes, 2% haircut and 0.05 USDC fee per fill. Separate from the USDC/JUP paper ledger above. The shadow book uses the same signals without the leader-exited and token-risk filters.</p>
        ${header}
        <h3 class="kpi-label" style="margin:14px 0 8px">Live activity (newest first)</h3>
        ${feedHtml}
        <h3 class="kpi-label" style="margin:18px 0 8px">Open paper positions</h3>
        ${posHtml}
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));margin-top:18px">
          <div><h3 class="kpi-label" style="margin:0 0 8px">Skips by reason · filtered</h3>${skipList(f)}</div>
          <div><h3 class="kpi-label" style="margin:0 0 8px">Skips by reason · shadow</h3>${skipList(s)}</div>
        </div>
        <h3 class="kpi-label" style="margin:18px 0 8px">Per leader</h3>
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))">${leaders}</div>
        <h3 class="kpi-label" style="margin:18px 0 8px">Coverage notes</h3>
        <ul class="muted" style="font-size:12px;line-height:1.6;margin:0;padding-left:18px">${gaps || '<li>None</li>'}<li>Equity marks open lots at a Jupiter sell quote net of costs (* = some lots not yet marked, valued at cost). The −6% stop is a trigger; fills can land below it.</li><li>Only swaps of one token against SOL or USDC signed by the leader are copied. RPC 429s this session: ${esc(p.rpc_429 ?? '—')}; shared-RPC pauses for main watcher: ${esc(p.main_new_429 ?? '—')}.</li></ul>
      </section>`;
    }

    function render() {
      if (!DATA) return;
      const m = markedFigures();
      const app = document.getElementById("app");
      destroyCharts();
      app.innerHTML = `
        ${tickerHtml()}
        <div class="wrap">
          ${headerHtml(m)}
          ${state.view === "live" ? liveViewHtml(m) : deskViewHtml(m)}
          ${copyBookHtml()}
          ${footerHtml()}
        </div>
        ${recapModalHtml()}`;
      bind();
      if (document.getElementById("priceChart")) drawPriceChart();
      if (document.getElementById("equityChart")) drawEquityChart();
      if (state.view === "live") animateEquity();
    }

    function bind() {
      document.querySelectorAll("button[data-view]").forEach((btn) => {
        btn.addEventListener("click", () => { state.view = btn.getAttribute("data-view"); render(); });
      });
      const recapOpen = document.getElementById("openRecap");
      if (recapOpen) recapOpen.addEventListener("click", () => { state.recap = true; render(); });
      const recapClose = document.getElementById("closeRecap");
      if (recapClose) recapClose.addEventListener("click", () => { state.recap = false; render(); });
      const recapBack = document.getElementById("recapBack");
      if (recapBack) recapBack.addEventListener("click", (ev) => {
        if (ev.target === recapBack) { state.recap = false; render(); }
      });
      const archived = document.getElementById("archivedToggle");
      if (archived) archived.addEventListener("click", () => { state.showArchived = !state.showArchived; render(); });
      const gw = document.getElementById('gmgnWalletFilter');
      if (gw) gw.addEventListener('change', () => { state.gmgnWallet = gw.value; render(); });
      const gs = document.getElementById('gmgnSideFilter');
      if (gs) gs.addEventListener('change', () => { state.gmgnSide = gs.value; render(); });
      const gt = document.getElementById('gmgnTokenFilter');
      const applyToken = () => { state.gmgnToken = gt?.value || ''; render(); };
      if (gt) gt.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') applyToken(); });
      const ga = document.getElementById('gmgnApplyToken');
      if (ga) ga.addEventListener('click', applyToken);
      document.querySelectorAll("button[data-range]").forEach((btn) => {
        btn.addEventListener("click", () => { state.range = btn.getAttribute("data-range"); render(); });
      });
      document.querySelectorAll("button[data-wallet]").forEach((btn) => {
        btn.addEventListener("click", (ev) => {
          if (ev.target.closest("a[data-external]")) return;
          setWallet(btn.getAttribute("data-wallet"));
        });
      });
      document.querySelectorAll("button[data-bot]").forEach((btn) => {
        btn.addEventListener("click", () => { state.bot = btn.getAttribute("data-bot"); render(); });
      });
      const kind = document.getElementById("kindFilter");
      if (kind) kind.addEventListener("change", () => { state.kind = kind.value; render(); });
      const wallet = document.getElementById("walletFilter");
      if (wallet) wallet.addEventListener("change", () => { state.wallet = wallet.value; render(); });
      const date = document.getElementById("dateFilter");
      if (date) date.addEventListener("change", () => { state.date = date.value; render(); });
      const clear = document.getElementById("clearFilters");
      if (clear) clear.addEventListener("click", () => { state.wallet = "all"; state.kind = "all"; state.date = ""; render(); });
      document.querySelectorAll("th[data-sort]").forEach((th) => {
        th.addEventListener("click", () => {
          const key = th.getAttribute("data-sort");
          if (state.sortKey === key) state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
          else { state.sortKey = key; state.sortDir = key === "observed_time_iso" ? "desc" : "asc"; }
          render();
        });
      });
    }

    async function pollPrice() {
      let lastError = null;
      for (const url of PRICE_URLS) {
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const body = await res.json();
          const row = body[JUP_MINT];
          const usd = Number(row && row.usdPrice);
          if (!(usd > 0)) throw new Error("missing usdPrice");
          livePrice = usd;
          liveAt = new Date();
          liveError = null;
          if (DATA.price) {
            if (row.priceChange24h != null) DATA.price.change_24h_pct = Number(row.priceChange24h);
            const ch1 = row.priceChange1h ?? row.priceChange1H;
            if (ch1 != null) DATA.price.change_1h_pct = Number(ch1);
          }
          render();
          return;
        } catch (err) {
          lastError = err;
        }
      }
      liveError = lastError ? String(lastError) : "price poll failed";
      render();
    }

    async function pollPublishedData() {
      try {
        const res = await fetch('data.json', {cache: 'no-store'});
        if (!res.ok) return;
        const next = await res.json();
        if (next?.generated_at_iso && next?.kpis) { DATA = next; render(); }
      } catch (_) { /* Keep the last snapshot; its age is displayed explicitly. */ }
    }

    async function boot() {
      const app = document.getElementById("app");
      try {
        const res = await fetch("data.json", { cache: "no-store" });
        if (!res.ok) throw new Error("Could not load data.json (" + res.status + ")");
        DATA = await res.json();
        if (!state.archivedDefaulted) {
          const currentMarkers = (DATA.charts && DATA.charts.markers) || [];
          state.showArchived = false;
          state.archivedDefaulted = true;
        }
        render();
        pollPrice();
        setInterval(pollPrice, 30000);
        setInterval(pollPublishedData, 60000);
        pollCopyBook();
        setInterval(pollCopyBook, 60000);
      } catch (err) {
        app.innerHTML = `<div class="wrap"><div class="error">Could not load the paper dashboard data. ${esc(err.message || err)}</div></div>`;
      }
    }

    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
    else boot();
  </script>
</body>
</html>
